name: Deploy to Server

on:
  push:
    branches:
      - linkreader
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: michi-reader
  PORT: 3032

jobs:
  checkout:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

  cleanup:
    runs-on: self-hosted
    needs: checkout
    steps:
      - name: Cleanup Docker images
        run: make prod-cleanup

  setup:
    runs-on: self-hosted
    needs: cleanup
    steps:
      - name: Setup Environment
        run: make prod-setup

  build:
    runs-on: self-hosted
    needs: setup
    steps:
      - name: Build Docker images
        run: make prod-build

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy service
        run: make prod-start

