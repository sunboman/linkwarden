name: Deploy to Server

on:
  push:
    branches:
      - linkreader
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: michi-reader

jobs:
  checkout:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

  cleanup:
    runs-on: self-hosted
    needs: checkout
    steps:
      - name: Cleanup Docker resources
        run: |
          make prod-down || true

  build:
    runs-on: self-hosted
    needs: cleanup
    steps:
      - name: Build Docker images
        run: |
          make prod-build

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy service
        run: |
          make prod-deploy

