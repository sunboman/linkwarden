name: Deploy to Server

on:
  push:
    branches:
      - linkreader
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: linkreader

jobs:
  checkout:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

  cleanup:
    runs-on: self-hosted
    needs: checkout
    steps:
      - name: Cleanup Docker resources
        run: |
          chmod +x ./scripts/cleanup.sh
          ./scripts/cleanup.sh

  build:
    runs-on: self-hosted
    needs: cleanup
    steps:
      - name: Build Docker images
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy service
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh

