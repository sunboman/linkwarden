# Linkwarden v2 Production Docker Compose
# All services in a single container with nginx reverse proxy

services:
  linkwarden:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: linkwarden-v2
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      # Data directory (inside container)
      - DATA_DIR=/app/data
      # Database
      - DATABASE_URL=sqlite:////app/data/linkwarden.db
      # Security
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # Worker
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - TIMEOUT=${TIMEOUT:-30000}
      - SCREENSHOT_DIR=/app/data/screenshots
    volumes:
      # Persist data (database and screenshots)
      - ${DATA_DIR:-./data}:/app/data
    labels:
      - "homepage.group=Bookmarks"
      - "homepage.name=Linkwarden"
      - "homepage.icon=/icons/linkwarden.png"
      - "homepage.href=http://${HOST:-localhost}:${PORT:-3000}"
      - "homepage.description=Self-hosted bookmark manager v2"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
