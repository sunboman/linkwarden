# Michi Reader Production Docker Compose
# All services in a single container with nginx reverse proxy

services:
  michi-reader:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: michi-reader
    restart: unless-stopped
    ports:
      - "${PORT:-3032}:80"
    environment:
      # Data directory (inside container)
      - DATA_DIR=/app/data
      # Database
      - DATABASE_URL=sqlite:////app/data/michireader.db
      # Security
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # Worker
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - TIMEOUT=${TIMEOUT:-30000}
      - SCREENSHOT_DIR=/app/data/screenshots
    volumes:
      # Persist data (database and screenshots)
      - ${DATA_DIR:-./data}:/app/data
    labels:
      - "homepage.group=Bookmarks"
      - "homepage.name=Michi Reader"
      - "homepage.icon=/icons/michi-reader.png"
      - "homepage.href=http://${HOST:-localhost}:${PORT:-3032}"
      - "homepage.description=Michi reader"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
